# Produção: tudo vem de variáveis de ambiente. A aplicação usa um usuário sem DDL;
# as migrations usam uma credencial separada (princípio do menor privilégio).
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
  flyway:
    user: ${DB_MIGRACAO_USUARIO}
    password: ${DB_MIGRACAO_SENHA}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
