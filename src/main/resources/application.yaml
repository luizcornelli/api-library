# Configuração comum a todos os profiles. Sem segredos: credenciais vêm de variáveis de ambiente.
spring:
  application:
    name: api-biblioteca
  profiles:
    # Preenchido pelo profile Maven (dev, test ou prod) via filtragem de recursos.
    active: '@spring.profiles.active@'
  jpa:
    open-in-view: false
    hibernate:
      # O schema é responsabilidade do Flyway; o Hibernate só confere se as entidades batem.
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  error:
    include-stacktrace: never
    include-message: never

biblioteca:
  fuso-horario: America/Recife
  emprestimo:
    prazo-dias: 14

springdoc:
  swagger-ui:
    path: /swagger-ui.html
