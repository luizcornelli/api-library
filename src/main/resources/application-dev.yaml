# Desenvolvimento local: PostgreSQL do compose.yaml. Credenciais lidas do arquivo .env (fora do git).
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:${DB_PORTA:5432}/${DB_NOME:biblioteca}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
